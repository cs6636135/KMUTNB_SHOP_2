{% if status == 'reserved' %}
    <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-100 text-amber-800 border border-amber-300">
        <span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span>
        จองแล้ว (รอรับสินค้า)
    </span>
{% elif status == 'picked_up' %}
    <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800 border border-emerald-300">
        <i data-lucide="check" class="w-3.5 h-3.5"></i>
        รับสินค้าแล้ว
    </span>
{% elif status == 'expired' %}
    <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-rose-100 text-rose-800 border border-rose-300">
        <i data-lucide="clock" class="w-3.5 h-3.5"></i>
        หมดเวลา 4 ชม. (คืนสต็อกแล้ว)
    </span>
{% elif status == 'cancelled' %}
    <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-700 border border-slate-300">
        <i data-lucide="x" class="w-3.5 h-3.5"></i>
        ยกเลิกแล้ว
    </span>
{% else %}
    <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-gray-100 text-gray-800">
        {{ status }}
    </span>
{% endif %}
